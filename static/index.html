<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DayFlow 日程规划助手</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><main><header><div><p class="eyebrow">本地任务规划助手 · 无需 API KEY</p><h1>少做计划，<br>先做重要的事。</h1><p class="intro">添加截止时间、预计耗时和重要程度。DayFlow 会生成一份可执行的计划，解释排序原因，并重新安排未完成的任务。</p></div><button id="demo" class="secondary">加载示例任务</button></header>
<section class="grid"><form id="taskForm" class="card"><h2>添加任务</h2><label>需要完成什么？<input name="title" required minlength="2" placeholder="例如：完成项目提纲"></label><label>截止时间<input name="due_at" type="datetime-local" required></label><div class="two"><label>预计分钟数<input name="estimate_minutes" type="number" min="10" max="600" value="45" required></label><label>重要程度<select name="importance"><option value="5">5 · 非常重要</option><option value="4">4 · 重要</option><option value="3" selected>3 · 一般</option><option value="2">2 · 较低</option><option value="1">1 · 可选</option></select></label></div><label>需要的精力<select name="energy"><option value="high">高度专注</option><option value="medium" selected>中等精力</option><option value="low">低精力</option></select></label><button>添加任务</button></form>
<div class="card"><h2>生成今日计划</h2><p>你今天实际能投入多少专注时间？</p><div class="time"><input id="available" type="number" min="15" max="720" value="180"><span>分钟</span></div><button id="plan">生成我的计划</button><p id="status" role="status"></p></div></section>
<section><div class="section-title"><h2>智能规划结果</h2><span id="summary"></span></div><div id="planOutput" class="plan empty">请先添加任务，再生成计划。</div></section>
<section><div class="section-title"><h2>任务记录</h2><span>数据保存在本地</span></div><div id="tasks" class="tasks"></div></section></main><script src="/static/app.js"></script></body></html>
